site_name: Python Backend Engineer Helper
theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - content.code.copy

nav:
  - Home: index.md
  - Curriculum: CURRICULUM.md
  - Python:
      - Overview: python/index.md
      - Foundation:
          - Data Types and Collections: python/01-data-types-and-collections.md
          - Comprehensions and Functions: python/02-comprehensions-and-functions.md
          - Exceptions: python/03-exceptions.md
          - Modules and Packages: python/04-modules-and-packages.md
          - Type Hints: python/05-type-hints.md
      - Intermediate:
          - OOP Fundamentals: python/06-oop-fundamentals.md
          - Dataclasses, Properties, and Dunder Methods: python/07-dataclasses-and-dunder-methods.md
          - Iterators and Generators: python/08-iterators-and-generators.md
          - Decorators and Closures: python/09-decorators-and-closures.md
          - Context Managers and Descriptors: python/10-context-managers-and-descriptors.md
      - Advanced:
          - Memory Management: python/11-memory-management.md
          - GIL and CPython: python/12-gil-and-cpython.md
          - Asyncio and Concurrency: python/13-asyncio-and-concurrency.md
          - Performance and Profiling: python/14-performance-and-profiling.md
  - Python Packaging:
      - Overview: packaging/index.md
